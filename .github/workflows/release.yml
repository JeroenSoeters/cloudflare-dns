#
# Tag-push wrapper that triggers the centralized build pipeline in
# `formae-actions/.github/workflows/plugin-build.yml`.
#
# Required repo secret: HUB_DISPATCH_PAT
#   - Fine-grained GitHub PAT with `actions: read and write` permission
#     scoped only to `platform-engineering-labs/formae-actions`.
#
name: release
on:
  push:
    tags:
      - '[0-9]*'
      - 'v[0-9]*'

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.HUB_DISPATCH_PAT }}
        run: |
          gh workflow run plugin-build.yml \
            -R platform-engineering-labs/formae-actions \
            -f plugin-name=cloudflare-dns \
            -f plugin-repo=$GITHUB_REPOSITORY \
            -f ref=$GITHUB_REF_NAME
